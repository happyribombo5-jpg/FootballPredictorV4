name: Build Football Predictor APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e
          unzip -o FootballPredictorV4_Universal_Free.zip -d extracted

      - name: Locate Android project
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          mkdir -p final-apk
          cp "$APK" final-apk/Football-Predictor.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Football-Predictor-APK
          path: final-apk/Football-Predictor.apk
          if-no-files-found: error
          retention-days: 7
